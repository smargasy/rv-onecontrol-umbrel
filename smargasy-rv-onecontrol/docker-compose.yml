version: "3.7"

services:
  app_proxy:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_HOST: host.docker.internal
      APP_PORT: 18787
      PROXY_AUTH_ADD: "false"

  server:
    image: ghcr.io/smargasy/rv-onecontrol:sha-d70a053
    restart: on-failure
    init: true
    network_mode: host
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      LISTEN_ADDR: 0.0.0.0:18787
      STATIC_DIR: /app/static
      DATA_DIR: /data
      ONECONTROL_MOCK: "false"
      ONECONTROL_GATEWAY: "192.168.1.1:6969"
      ONECONTROL_CMD_MODE: "inline"
      ONECONTROL_FIXTURE: /app/fixtures/andreas_devices.json
      ONECONTROL_RUN_UID: "1000"
      ONECONTROL_RUN_GID: "1000"
      RUST_LOG: rv_onecontrol_web=info
